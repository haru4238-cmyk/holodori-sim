[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer"
    Permissions-Policy = "camera=(), microphone=(), geolocation=(), payment=()"
    Content-Security-Policy = "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; img-src 'self' data:; style-src 'self'; script-src 'self' 'sha256-wBYlaYM0dBlgubhCCqXBmoqQv49C4GA7RR7RdUQLtYI='; connect-src 'self'; worker-src 'self'; manifest-src 'self'; upgrade-insecure-requests"

[[headers]]
  for = "/app_data.json"
  [headers.values]
    Cache-Control = "public, max-age=3600"
